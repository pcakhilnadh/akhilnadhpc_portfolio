<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%SEO_TITLE%</title>
    <meta
      name="description"
      content="%DESCRIPTION%"
    />
    <meta name="keywords" content="%KEYWORDS%" />
    <meta name="author" content="%FULL_NAME%" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="%SITE_URL%" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%SHORT_NAME%" />

    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="%FULL_NAME%" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%images/og.jpg" />
    <meta property="og:image:alt" content="%FULL_NAME%, Senior Data Scientist" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@akhilnadhpc" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%images/og.jpg" />

    <!-- Catch Chrome's install offer even if it fires before the app's code has
         loaded (it can on a refresh). src/hooks/useInstallPrompt.ts takes it from here. -->
    <script>
      addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__installEvent = e;
      });
      addEventListener("appinstalled", function () {
        window.__installEvent = null;
      });
    </script>

    <!-- Structured data (schema.org Person / ProfilePage), built from src/data by scripts/seo.ts -->
    <script type="application/ld+json">%JSON_LD%</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>
      <h1>%FULL_NAME%</h1>
      <p>%DESCRIPTION%</p>
      <p>Please enable JavaScript to see the interactive portfolio.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
